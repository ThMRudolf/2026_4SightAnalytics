[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "com2wa"
version = "0.1.0"
description = "Reusable process-monitoring alert engine with WhatsApp (Meta Cloud API) delivery"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ThMRudolf" }]
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]
server = ["flask>=3.0", "waitress>=3.0", "python-dotenv>=1.0"]
dev = ["pytest>=8.0", "python-dotenv>=1.0", "flask>=3.0"]

[project.scripts]
com2wa-server = "com2wa.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
